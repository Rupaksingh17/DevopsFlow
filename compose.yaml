services:
  web:
    build: .
    image: devopsflow:local
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
