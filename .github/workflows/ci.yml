name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag devopsflow:${{ github.sha }} .
